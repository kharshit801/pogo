name: Feature request
description: Suggest an idea for pogo
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, e.g. "On my network, Zoom calls fail because ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like pogo to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
