name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile
        run: python -m compileall -q pogo tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install as a package
        run: |
          python -m pip install --quiet .
          pogo --version
          pogo help on
      - name: CLI smoke test
        run: |
          export POGO_HOME="$(mktemp -d)"
          ./bin/pogo
          ./bin/pogo setup --host 10.0.0.1 --port 3128 --type http --user ci
          ./bin/pogo rules add "*.example.com" block --at 1
          ./bin/pogo rules check www.example.com
          ./bin/pogo status
          ./bin/pogo tun --dry-run
