name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# POGO_NO_TELEMETRY keeps CI's real pogo runs from ever reaching a live analytics project.
env:
  POGO_NO_TELEMETRY: '1'


jobs:
  test:
    name: ${{ matrix.os == 'windows-latest' && 'Windows' || 'macOS' }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile
        run: python -m compileall -q pogo tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python tests/cli_smoke.py
      - name: No-prompt helper installs for real (macOS sudoers + wrapper)
        if: runner.os == 'macOS'
        run: |
          sudo "$(command -v python)" bin/pogo setup-helper
          test -x /usr/local/libexec/pogo-tun
          test -f /etc/sudoers.d/pogo
          sudo visudo -cf /etc/sudoers.d/pogo        # the rule we wrote is valid sudoers
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from pogo import elevate
          assert elevate.mac_ready(), "the wrapper + sudo rule should be active after setup"
          PY
          sudo "$(command -v python)" bin/pogo setup-helper --remove
          test ! -e /usr/local/libexec/pogo-tun && test ! -e /etc/sudoers.d/pogo
          python -c "import sys; sys.path.insert(0,'.'); from pogo import elevate; assert not elevate.mac_ready()"
      - name: No-prompt helper installs for real (Windows scheduled task)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python bin/pogo setup-helper
          if ($LASTEXITCODE -ne 0) { throw "setup-helper failed" }
          python -c "import sys; sys.path.insert(0,'.'); from pogo import elevate; assert elevate.win_ready(), 'task missing after setup'"
          if ($LASTEXITCODE -ne 0) { throw "the task was not created" }
          python bin/pogo setup-helper --remove
          if ($LASTEXITCODE -ne 0) { throw "remove failed" }
          python -c "import sys; sys.path.insert(0,'.'); from pogo import elevate; assert not elevate.win_ready(), 'task still present after remove'"
          if ($LASTEXITCODE -ne 0) { throw "the task was not removed" }
          Write-Host "the no-prompt task was created and removed cleanly"
      - name: Install as a package
        run: |
          python -m pip install --quiet .
          pogo --version
      - name: Windows installer (Windows PowerShell 5.1, the way users run it)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:POGO_SOURCE = (Get-Location).Path
          Get-Content .\install.ps1 -Raw | Invoke-Expression
          & "$env:USERPROFILE\.pogo\bin\pogo.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Windows uninstall (through the installed pogo command)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & "$env:USERPROFILE\.pogo\bin\pogo.cmd" uninstall --yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Sleep -Seconds 8   # the folder holding pogo.cmd goes once pogo.cmd has exited
          if (Test-Path "$env:USERPROFILE\.pogo") {
            Get-ChildItem -Recurse "$env:USERPROFILE\.pogo"
            throw "the .pogo folder is still there"
          }
          $path = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($path -like '*\.pogo\bin*') { throw "the user PATH still has pogo in it: $path" }
          Write-Host "uninstalled cleanly"
      - name: macOS installer (a fresh install, then an update after a history rewrite)
        if: runner.os == 'macOS'
        run: |
          export POGO_INSTALL_DIR="$RUNNER_TEMP/installer/share/pogo" POGO_BIN_DIR="$RUNNER_TEMP/installer/bin"
          bash install.sh
          "$POGO_BIN_DIR/pogo" --version
          # an installed copy whose history main no longer has, as after a rewrite of main
          git -C "$POGO_INSTALL_DIR" checkout -q --orphan rewritten
          git -C "$POGO_INSTALL_DIR" -c user.name=ci -c user.email=ci@example.com commit -q -m "old history"
          git -C "$POGO_INSTALL_DIR" branch -q -D main
          git -C "$POGO_INSTALL_DIR" branch -q -m main
          bash install.sh
          test "$(git -C "$POGO_INSTALL_DIR" rev-parse HEAD)" = \
               "$(git ls-remote https://github.com/kharshit801/pogo.git refs/heads/main | cut -f1)"
          "$POGO_BIN_DIR/pogo" --version
      - name: macOS uninstall (in the layout install.sh creates)
        if: runner.os == 'macOS'
        run: |
          export POGO_INSTALL_DIR="$RUNNER_TEMP/share/pogo" POGO_BIN_DIR="$RUNNER_TEMP/bin" POGO_HOME="$RUNNER_TEMP/pogo-home"
          mkdir -p "$POGO_BIN_DIR" "$RUNNER_TEMP/share"
          cp -R . "$POGO_INSTALL_DIR"   # what install.sh's git clone puts there
          ln -s "$POGO_INSTALL_DIR/bin/pogo" "$POGO_BIN_DIR/pogo"
          "$POGO_BIN_DIR/pogo" setup --host 10.0.0.1 --port 3128 --type http --user ci
          "$POGO_BIN_DIR/pogo" uninstall --yes
          test ! -e "$POGO_INSTALL_DIR" && test ! -L "$POGO_BIN_DIR/pogo" && test ! -e "$POGO_HOME"
          echo "uninstalled cleanly"
