name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os == 'windows-latest' && 'Windows' || 'macOS' }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile
        run: python -m compileall -q pogo tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python tests/cli_smoke.py
      - name: Install as a package
        run: |
          python -m pip install --quiet .
          pogo --version
      - name: Windows installer (Windows PowerShell 5.1, the way users run it)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:POGO_SOURCE = (Get-Location).Path
          Get-Content .\install.ps1 -Raw | Invoke-Expression
          & "$env:USERPROFILE\.pogo\bin\pogo.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
