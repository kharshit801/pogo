<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="pogo logo">
  <title>pogo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#shine)"/>
  <g transform="translate(-3 -2)">
  <!-- many apps converge into one node ... -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="6.5">
    <path d="M28 44 C 44 44, 46 70, 58 70" stroke-opacity="0.7"/>
    <path d="M28 70 L 58 70" stroke-opacity="0.7"/>
    <path d="M28 96 C 44 96, 46 70, 58 70" stroke-opacity="0.7"/>
    <!-- ... then make one hop out to the internet -->
    <path d="M58 70 C 64 28, 92 24, 100 58" stroke-width="7.5"/>
  </g>
  <circle cx="28" cy="44" r="5" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="28" cy="70" r="5" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="28" cy="96" r="5" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="58" cy="70" r="9" fill="#FFFFFF"/>
  <path d="M91 55 L101 64 L108 51" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
