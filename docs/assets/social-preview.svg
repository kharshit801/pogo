<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="pogo: route every app on your Mac or PC through your proxy">
  <!-- render with: rsvg-convert docs/assets/social-preview.svg -o docs/assets/social-preview.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1B1745"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- logo (white version, at its native size so it stays sharp) -->
  <image href="logo-white.png" x="110" y="174" width="230" height="176"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="420" y="268" font-size="120" font-weight="800" fill="#FFFFFF" letter-spacing="-3">pogo</text>
    <text x="424" y="334" font-size="38" font-weight="600" fill="#E2E8F0">Route every app on your Mac or PC</text>
    <text x="424" y="382" font-size="38" font-weight="600" fill="#E2E8F0">through your proxy.</text>
    <text x="424" y="432" font-size="24" fill="#94A3B8">Open-source command-line alternative to Proxifier.</text>
  </g>

  <!-- command chip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" style="white-space:pre">
    <rect x="424" y="470" width="402" height="58" rx="14" fill="#0D1117" stroke="#30363D"/>
    <text xml:space="preserve" x="448" y="508"><tspan fill="#3FB950">$</tspan><tspan fill="#FFFFFF"> pogo on</tspan><tspan fill="#7D8590">   # that's it</tspan></text>
  </g>
</svg>
