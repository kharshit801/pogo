<svg xmlns="http://www.w3.org/2000/svg" width="960" height="306" viewBox="0 0 960 306" role="img" aria-label="Apps reach pogo through the system proxy or a virtual interface; its rules send each connection through your proxy, straight out, or nowhere">
  <title>How pogo works</title>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="103" font-size="15" font-weight="600" fill="#F0F0F0">Apps that use proxy settings</text>
    <text x="40" y="124" font-size="13" fill="#A3A3A3">browsers, Slack, Zoom</text>
    <path d="M262 98 H365 C405 98 395.0 153 435.0 153" fill="none" stroke="#6A6A6A" stroke-width="1.5" stroke-linecap="round"/>
    <text x="266" y="90" font-size="12" fill="#8C8C8C">system proxy</text>
    <text x="40" y="213" font-size="15" font-weight="600" fill="#F0F0F0">Every other app</text>
    <text x="40" y="234" font-size="13" fill="#A3A3A3">Docker, git, games, IDE helpers</text>
    <path d="M262 208 H365 C405 208 395.0 153 435.0 153" fill="none" stroke="#6A6A6A" stroke-width="1.5" stroke-linecap="round"/>
    <text x="266" y="200" font-size="12" fill="#8C8C8C">virtual interface</text>
    <path transform="translate(451.00 131.52) scale(0.28415)" d="M10.13 0.10 L171.33 0.00 L178.33 0.74 L184.33 2.68 L191.33 6.85 L196.65 12.10 L199.48 16.10 L202.68 23.10 L203.69 27.10 L204.12 33.10 L203.68 39.10 L202.66 43.10 L200.58 48.10 L178.49 86.10 L174.45 91.10 L169.33 95.43 L163.33 98.56 L155.33 100.60 L100.33 100.71 L99.69 100.10 L100.11 99.10 L127.38 52.10 L127.78 51.10 L127.33 50.58 L55.33 50.46 L49.33 49.48 L43.33 47.39 L37.33 43.60 L31.01 37.10 L11.10 3.10 L9.98 1.10Z M42.58 101.10 L49.33 100.68 L98.33 100.68 L99.09 101.10 L79.51 135.10 L75.90 140.10 L71.33 144.46 L68.33 146.53 L62.33 149.40 L57.33 150.64 L51.33 151.20 L0.16 151.10 L0.00 150.10 L1.10 148.10 L21.61 113.10 L25.61 109.10 L30.33 105.55 L35.33 102.84Z" fill="#F0F0F0" fill-rule="evenodd"/>
    <text x="480" y="204" font-size="15" font-weight="600" fill="#F0F0F0" text-anchor="middle">pogo</text>
    <text x="480" y="223" font-size="12" fill="#A3A3A3" text-anchor="middle">first matching rule wins</text>
    <path d="M525.0 153 C570.0 153 565 73 610 73 H690" fill="none" stroke="#6A6A6A" stroke-width="1.5" stroke-linecap="round"/>
    <text x="682" y="64" font-size="12" fill="#8C8C8C" text-anchor="end">proxy</text>
    <circle cx="690" cy="73" r="3.5" fill="#F0F0F0"/>
    <text x="708" y="78" font-size="15" font-weight="600" fill="#F0F0F0">Your proxy, then the internet</text>
    <text x="708" y="98" font-size="13" fill="#A3A3A3">logged in with your password</text>
    <path d="M525.0 153 C570.0 153 565 153 610 153 H690" fill="none" stroke="#6A6A6A" stroke-width="1.5" stroke-linecap="round"/>
    <text x="682" y="144" font-size="12" fill="#8C8C8C" text-anchor="end">direct</text>
    <circle cx="690" cy="153" r="3.5" fill="#F0F0F0"/>
    <text x="708" y="158" font-size="15" font-weight="600" fill="#F0F0F0">Straight out</text>
    <text x="708" y="178" font-size="13" fill="#A3A3A3">campus servers, your network</text>
    <path d="M525.0 153 C570.0 153 565 233 610 233 H690" fill="none" stroke="#6A6A6A" stroke-width="1.5" stroke-linecap="round"/>
    <text x="682" y="224" font-size="12" fill="#8C8C8C" text-anchor="end">block</text>
    <path d="M690 226 V240" stroke="#F0F0F0" stroke-width="2" stroke-linecap="round"/>
    <text x="708" y="238" font-size="15" font-weight="600" fill="#F0F0F0">Refused</text>
    <text x="708" y="258" font-size="13" fill="#A3A3A3">whatever your rules say</text>
  </g>
</svg>
